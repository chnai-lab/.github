<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="CHNAI LAB — building intelligence, creating empires. A Cambodian student-run product studio in Phnom Penh">
  <title>CHNAI LAB</title>
  <desc>An animated identity banner: a hexagonal lattice turning slowly in depth beside the studio mark, wordmark and tagline.</desc>

  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101A1B"/><stop offset="1" stop-color="#080E0F"/>
    </linearGradient>
    <radialGradient id="teal" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#17B08E" stop-opacity=".24"/>
      <stop offset="55%" stop-color="#17B08E" stop-opacity=".05"/>
      <stop offset="100%" stop-color="#17B08E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff" stop-opacity=".045"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".8"/>
    </linearGradient>
    <mask id="floorMask"><rect width="1280" height="400" fill="url(#fadeFloor)"/></mask>
    <clipPath id="frame"><rect width="1280" height="400" rx="16"/></clipPath>
    <polygon id="hex" points="0,-52 45,-26 45,26 0,52 -45,26 -45,-26"/>

    <style>
      .drift { animation: drift 16s linear infinite }
      @keyframes drift { to { transform: translateY(44px) } }
      .spin  { animation: spin 44s linear infinite; transform-origin: 1010px 200px }
      @keyframes spin { to { transform: rotate(360deg) } }
      .spinb { animation: spin 66s linear infinite reverse; transform-origin: 1010px 200px }
      .breathe { animation: breathe 9s ease-in-out infinite }
      @keyframes breathe { 0%,100% { opacity:.8 } 50% { opacity:1 } }
      .float { animation: float 8s ease-in-out infinite }
      @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }
      .shine { animation: shine 13s ease-in-out infinite }
      @keyframes shine { 0% { transform: translateX(-1400px) } 55%,100% { transform: translateX(1400px) } }
      .pulseA { animation: pulse 5.5s ease-in-out infinite }
      .pulseB { animation: pulse 5.5s ease-in-out infinite; animation-delay: -1.9s }
      .pulseC { animation: pulse 5.5s ease-in-out infinite; animation-delay: -3.7s }
      @keyframes pulse { 0%,100% { opacity:.18 } 50% { opacity:.62 } }
      @media (prefers-reduced-motion: reduce) {
        .drift,.spin,.spinb,.breathe,.float,.shine,.pulseA,.pulseB,.pulseC { animation: none }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="400" fill="url(#ground)"/>

    <g mask="url(#floorMask)" opacity=".45">
      <g class="drift" stroke="#EDF1F1" stroke-opacity=".06" stroke-width="1" fill="none">
        <path d="M-200 200H1480M-200 244H1480M-200 288H1480M-200 332H1480M-200 376H1480M-200 420H1480"/>
      </g>
      <g stroke="#EDF1F1" stroke-opacity=".045" stroke-width="1" fill="none">
        <path d="M640 190L-320 420M640 190L160 420M640 190L440 420M640 190L640 420M640 190L840 420M640 190L1120 420M640 190L1600 420"/>
      </g>
    </g>

    <circle cx="1010" cy="200" r="300" fill="url(#teal)" class="breathe"/>

    <g class="spin" fill="none" stroke="#17B08E" stroke-width="1.6">
      <use href="#hex" class="pulseA" transform="translate(1010 200) scale(1.9)"/>
      <use href="#hex" class="pulseB" transform="translate(1010 200) scale(1.28)"/>
    </g>
    <g class="spinb" fill="none" stroke="#EDF1F1" stroke-opacity=".9" stroke-width="1.1">
      <use href="#hex" class="pulseC" transform="translate(1010 200) scale(2.5)"/>
      <use href="#hex" class="pulseA" transform="translate(1010 200) scale(3.1)"/>
    </g>
    <circle cx="1010" cy="200" r="9" fill="#17B08E" class="breathe"/>
    <circle cx="1010" cy="200" r="20" fill="none" stroke="#17B08E" stroke-opacity=".3" stroke-width="1">
      <animate attributeName="r" values="14;58;14" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values=".34;0;.34" dur="7s" repeatCount="indefinite"/>
    </circle>

    <g class="float">
      <rect x="60" y="52" width="80" height="80" rx="19" fill="#F6F5F2"/>
      <image x="76" y="66" width="48" height="52" href="data:image/webp;base64,"/>
      <text x="164" y="112" font-family="ui-sans-serif, -apple-system, 'SF Pro Display', Inter, Segoe UI, Helvetica, Arial, sans-serif"
            font-size="36" font-weight="800" letter-spacing="6" fill="#EDF1F1">CHNAI LAB</text>
    </g>

    <g transform="translate(60 172)">
      <path d="M0 -4H32" stroke="#17B08E" stroke-width="2"/>
      <text x="46" y="0" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="12.5"
            font-weight="700" letter-spacing="3.6" fill="#3FBFA8">BUILDING INTELLIGENCE. CREATING EMPIRES.</text>
    </g>

    <g font-family="ui-sans-serif, -apple-system, 'SF Pro Text', Inter, Segoe UI, Helvetica, Arial, sans-serif"
       font-size="17" fill="#93A3A5">
      <text x="60" y="228">A Cambodian student-run product studio. A person owns the</text>
      <text x="60" y="254">decision, agents do bounded work, and evidence decides what</text>
      <text x="60" y="280">we may claim.</text>
    </g>

    <text x="60" y="356" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="11.5"
          letter-spacing="2.4" fill="#64757A">PHNOM PENH · CAMBODIA</text>

    <rect class="shine" width="420" height="400" fill="url(#sweep)"/>
  </g>
</svg>
